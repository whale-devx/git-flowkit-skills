name: Feature request
description: Propose an improvement with a real workflow example.
title: 'idea: '
body:
  - type: textarea
    id: problem
    attributes:
      label: Workflow problem
      description: What is blocked today? Include the repository/agent/engine context without secrets.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired behavior and acceptance test
      description: Show what success looks like, including safety and existing-config behavior.
    validations:
      required: true
