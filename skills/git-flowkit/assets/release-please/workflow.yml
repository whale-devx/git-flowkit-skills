name: Git FlowKit release
on:
  push:
    branches: ["__DEFAULT_BRANCH__"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: git-flowkit-release
  cancel-in-progress: false
jobs:
  release:
    # Opt in only after wiring the repository's required tests and review protections.
    if: >-
      vars.FLOWKIT_RELEASE_ENABLED == 'true' &&
      github.ref == 'refs/heads/__DEFAULT_BRANCH__'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
